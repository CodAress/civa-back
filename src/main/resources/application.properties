spring.application.name=civa-backend

# Server Configuration
server.port=8080

# Spring DataSource Configuration
spring.datasource.url = jdbc:postgresql://localhost:5432/civa?useSSL=true&serverTimezone=UTC
spring.datasource.username = postgres
spring.datasource.password = B@ldeon18
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Configuration
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
server.port=8080

# Spring Data JPA Configuration
spring.jpa.show-sql=true

# Spring Data JPA Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.naming.physical-strategy=com.civa.platform.shared.infrastructure.persistense.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy

